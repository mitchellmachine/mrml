services:
  git-trust-sign-current:
    profiles: [admin]
    image: "mrml/git-protected-signer:${MRML_GIT_VERSION:?set MRML_GIT_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21006:21006"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 256m
    cpus: 1.0
    restart: "no"
    volumes:
      - "mrml-git-signer-keys:/keys:ro"
      - "mrml-git-trust-construction:/policies:ro"
      - "mrml-git-trust-signatures:/signatures:rw"

  git-trust-sign-next:
    profiles: [admin]
    image: "mrml/git-protected-signer:${MRML_GIT_VERSION:?set MRML_GIT_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21006:21006"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 256m
    cpus: 1.0
    restart: "no"
    volumes:
      - "mrml-git-signer-next-keys:/keys:ro"
      - "mrml-git-trust-construction:/policies:ro"
      - "mrml-git-trust-signatures:/signatures:rw"

  git-signer-trust-advance:
    profiles: [admin]
    image: "mrml/git-protected-signer:${MRML_GIT_VERSION:?set MRML_GIT_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21006:21006"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 256m
    cpus: 1.0
    restart: "no"
    ulimits:
      nofile: {soft: 256, hard: 256}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=21006,gid=21006,mode=0700
    volumes:
      - type: volume
        source: mrml-git-signer-state
        target: /var/lib/mrml/git-protected-signer/state
        volume: {nocopy: true}
      - type: volume
        source: mrml-git-signer-keys
        target: /var/lib/mrml/git-protected-signer/keys
        read_only: true
        volume: {nocopy: true}
      - "mrml-gitd-policies:/var/lib/mrml/git-policies:ro"
      - "mrml-git-authority-transition:/run/mrml-transition:ro"

  git-protected-signer:
    image: "mrml/git-protected-signer:${MRML_GIT_VERSION:?set MRML_GIT_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21006:21006"
    group_add: ["21906"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 15s
    ulimits:
      nofile: {soft: 256, hard: 256}
    logging:
      driver: local
      options: {max-size: 5m, max-file: "3"}
    volumes:
      - type: volume
        source: mrml-git-signer-state
        target: /var/lib/mrml/git-protected-signer/state
        volume: {nocopy: true}
      - type: volume
        source: mrml-git-signer-keys
        target: /var/lib/mrml/git-protected-signer/keys
        read_only: true
        volume: {nocopy: true}
      - type: volume
        source: mrml-git-signer-channel
        target: /run/secrets
        read_only: true
        volume: {nocopy: true}
      - type: volume
        source: mrml-runtime-git-signer
        target: /run/mrml/git-protected-signer
        volume: {nocopy: true}
    command:
      - serve
      - /run/mrml/git-protected-signer/signer.sock
      - /run/secrets/signer-channel
      - "${MRML_GIT_CLIENT_UID:?set MRML_GIT_CLIENT_UID}"
      - "${MRML_GIT_CLIENT_GID:?set MRML_GIT_CLIENT_GID}"
      - "21006"
      - "21906"
      - "${MRML_PROTECTED_REPOSITORY:?set MRML_PROTECTED_REPOSITORY}"
      - "${MRML_REPOSITORY_GENERATION:?set MRML_REPOSITORY_GENERATION}"
      - "${MRML_TRUST_GENERATION:?set MRML_TRUST_GENERATION}"
      - "${MRML_REVOCATION_GENERATION:?set MRML_REVOCATION_GENERATION}"
      - /var/lib/mrml/git-protected-signer/state/generation.state
      - /var/lib/mrml/git-protected-signer/keys/authority-receipt-public.bin
      - /var/lib/mrml/git-protected-signer/keys/openpgp.seed
      - "${MRML_OPENPGP_CREATED_AT:?set MRML_OPENPGP_CREATED_AT}"
      - /var/lib/mrml/git-protected-signer/keys/ml-dsa-public.bin
      - /var/lib/mrml/git-protected-signer/keys/ml-dsa-secret.bin

volumes:
  mrml-git-signer-state:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-signer-state"
  mrml-git-signer-keys:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-signer-keys"
  mrml-git-signer-next-keys:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-signer-next-keys"
  mrml-git-trust-construction:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-trust-construction"
    external: true
  mrml-git-trust-signatures:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-trust-signatures"
  mrml-git-signer-channel:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-signer-channel"
  mrml-runtime-git-signer:
    name: "${MRML_VOLUME_PREFIX:-mrml}-runtime-git-signer"
  mrml-gitd-policies:
    name: "${MRML_VOLUME_PREFIX:-mrml}-gitd-policies"
    external: true
  mrml-git-authority-transition:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-authority-transition"
    external: true
