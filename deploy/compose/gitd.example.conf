version=1
server_name=git.example.invalid
listen_port=8443
repository_root=/mnt/mrml/gitd/repos
state_root=/mnt/mrml/gitd/state
quarantine_root=/mnt/mrml/gitd/quarantine
cache_root=/mnt/mrml/gitd/cache
receipt_root=/mnt/mrml/gitd/receipts
policy_root=/mnt/mrml/gitd/policies
repository_catalog=/mnt/mrml/gitd/policies/repositories.v1
profile_catalog=/mnt/mrml/gitd/policies/profiles.v1
token_records=/mnt/mrml/gitd/state/tokens.v1
token_pepper=/run/secrets/gitd-token-pepper
authority_socket=/run/mrml/git-authority/authority.sock
certd_socket=/run/mrml/certd-gitd/certd.sock
authority_capability=/run/secrets/git-authority-channel
certd_capability=/run/secrets/certd-gitd-channel
gitd_uid=21001
gitd_gid=21001
authority_uid=21002
authority_gid=21002
certd_uid=21003
certd_gid=21003
next_authority_request_id=1
next_certd_request_id=1
max_connections=4096
max_uploads=128
max_receives=16
max_body_bytes=8589934592
drain_seconds=30
