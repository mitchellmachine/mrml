services:
  git-trust-transition:
    profiles: [admin]
    image: "mrml/git-authority:${MRML_GIT_VERSION:?set MRML_GIT_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21001:21001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 256m
    cpus: 1.0
    restart: "no"
    ulimits:
      nofile: {soft: 256, hard: 256}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=21001,gid=21001,mode=0700
    volumes:
      - "mrml-gitd-policies:/var/lib/mrml/git-policies:rw"
      - "mrml-git-authority-config:/etc/mrml/authority:ro"
      - "mrml-git-authority-transition:/run/mrml-transition:ro"

  git-authority:
    image: "mrml/git-authority:${MRML_GIT_VERSION:?set MRML_GIT_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21002:21002"
    group_add: ["21901"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 30s
    ulimits:
      nofile: {soft: 4096, hard: 4096}
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=21002,gid=21002,mode=0700
    volumes:
      - "mrml-authority-state:/var/lib/mrml/authority:rw"
      - "mrml-gitd-policies:/var/lib/mrml/git-policies:ro"
      - "mrml-runtime-git-authority:/run/mrml/git-authority:rw"
      - "mrml-git-authority-secrets:/run/secrets:ro"
      - "mrml-git-authority-config:/etc/mrml/authority:ro"
    command:
      - serve-catalog
      - /run/mrml/git-authority/authority.sock
      - /run/secrets/git-authority-channel
      - "21001"
      - "21001"
      - "21002"
      - "21002"
      - /var/lib/mrml/git-policies
      - /var/lib/mrml/authority/proofs
      - /var/lib/mrml/authority/generations
      - /etc/mrml/authority/repositories.v1
      - /etc/mrml/authority/openpgp-public.asc
      - /etc/mrml/authority/ml-dsa-public.bin
      - /run/secrets/receipt.key
      - "${MRML_AUTHORITY_VALIDATION_TIME:?set MRML_AUTHORITY_VALIDATION_TIME}"
    healthcheck:
      test:
        - CMD
        - /usr/bin/mrml-git-authority
        - listener-health
        - /run/mrml/git-authority/authority.sock
        - "21002"
        - "21901"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  gitd:
    image: "mrml/gitd:${MRML_GIT_VERSION:?set MRML_GIT_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21001:21001"
    group_add: ["21901", "21902"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 192
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    stop_grace_period: 45s
    ulimits:
      nofile: {soft: 16384, hard: 16384}
    logging:
      driver: local
      options: {max-size: 20m, max-file: "3"}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=21001,gid=21001,mode=0700
    ports:
      - "${MRML_GIT_BIND_IP:-0.0.0.0}:443:8443/tcp"
      - "${MRML_GIT_BIND_IP:-0.0.0.0}:443:8443/udp"
    depends_on:
      git-authority: {condition: service_healthy}
      certd: {condition: service_healthy}
    networks: [git-public]
    volumes:
      - "mrml-gitd-repos:/mnt/mrml/gitd/repos:rw"
      - "mrml-gitd-state:/mnt/mrml/gitd/state:rw"
      - "mrml-gitd-quarantine:/mnt/mrml/gitd/quarantine:rw"
      - "mrml-gitd-cache:/mnt/mrml/gitd/cache:rw"
      - "mrml-gitd-receipts:/mnt/mrml/gitd/receipts:rw"
      - "mrml-gitd-policies:/mnt/mrml/gitd/policies:ro"
      - "mrml-runtime-git-authority:/run/mrml/git-authority:ro"
      - "mrml-runtime-certd-gitd:/run/mrml/certd-gitd:ro"
      - "mrml-gitd-secrets:/run/secrets:ro"
      - "mrml-gitd-config:/etc/mrml:ro"
    command: [serve, /etc/mrml/gitd.conf, "${MRML_AUTHORITY_SIGNER_IDENTITY:?set MRML_AUTHORITY_SIGNER_IDENTITY}"]
    healthcheck:
      test: [CMD, /usr/bin/mrml-gitd, listener-health, /etc/mrml/gitd.conf]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  git-public:
    driver: bridge
    internal: false

volumes:
  mrml-authority-state:
    name: "${MRML_VOLUME_PREFIX:-mrml}-authority-state"
  mrml-gitd-repos:
    name: "${MRML_VOLUME_PREFIX:-mrml}-gitd-repos"
  mrml-gitd-state:
    name: "${MRML_VOLUME_PREFIX:-mrml}-gitd-state"
  mrml-gitd-quarantine:
    name: "${MRML_VOLUME_PREFIX:-mrml}-gitd-quarantine"
  mrml-gitd-cache:
    name: "${MRML_VOLUME_PREFIX:-mrml}-gitd-cache"
  mrml-gitd-receipts:
    name: "${MRML_VOLUME_PREFIX:-mrml}-gitd-receipts"
  mrml-gitd-policies:
    name: "${MRML_VOLUME_PREFIX:-mrml}-gitd-policies"
  mrml-runtime-git-authority:
    name: "${MRML_VOLUME_PREFIX:-mrml}-runtime-git-authority"
  mrml-runtime-certd-gitd:
    name: "${MRML_VOLUME_PREFIX:-mrml}-runtime-certd-gitd"
  mrml-git-authority-secrets:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-authority-secrets"
  mrml-git-authority-config:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-authority-config"
  mrml-git-authority-transition:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-authority-transition"
  mrml-gitd-secrets:
    name: "${MRML_VOLUME_PREFIX:-mrml}-gitd-secrets"
  mrml-gitd-config:
    name: "${MRML_VOLUME_PREFIX:-mrml}-gitd-config"
