name: mrml-acme

services:
  certd:
    image: "mrml/certd:${MRML_ACME_VERSION:?set MRML_ACME_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21003:21003"
    group_add:
      - "21902"
      - "21903"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=21003,gid=21003,mode=0700
    volumes:
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/certd/state:/var/lib/mrml/certd:rw"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/certd/publications:/var/lib/mrml/publications:rw"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/runtime/certd-gitd:/run/mrml/certd-gitd:rw"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/runtime/certd-acmed:/run/mrml/certd-acmed:rw"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/secrets/certd/certd-unlock.key:/run/secrets/certd-unlock.key:ro"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/secrets/channels/certd-gitd.cap.certd:/run/secrets/certd-gitd.cap:ro"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/secrets/channels/certd-acmed.cap.certd:/run/secrets/certd-acmed.cap:ro"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/config/certd.json:/etc/mrml/certd/config.json:ro"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/config/acme-trust-roots.pem:/etc/mrml/certd/acme-trust-roots.pem:ro"
    healthcheck:
      test: [CMD, /usr/bin/mrml-certd, check-config]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  acmed:
    image: "mrml/acmed:${MRML_ACME_VERSION:?set MRML_ACME_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21004:21004"
    group_add:
      - "21903"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      certd:
        condition: service_healthy
    networks:
      - acme-egress
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=21004,gid=21004,mode=0700
    volumes:
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/acmed/state:/var/lib/mrml/acmed:rw"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/acmed/challenges:/var/lib/mrml/challenges:rw"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/runtime/certd-acmed:/run/mrml/certd-acmed:rw"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/secrets/acmed/acmed-state.key:/run/secrets/acmed-state.key:ro"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/secrets/acmed/cloudflare-api-token:/run/secrets/cloudflare-api-token:ro"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/secrets/channels/certd-acmed.cap.acmed:/run/secrets/certd-acmed.cap:ro"
      - "${MRML_DEPLOY_ROOT:-/mnt/mrml}/config/acmed.json:/etc/mrml/acmed/config.json:ro"
    healthcheck:
      test: [CMD, /usr/bin/mrml-acmed, check-config]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  acme-egress:
    driver: bridge
    internal: false
