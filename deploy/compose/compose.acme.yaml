name: "${MRML_VOLUME_PREFIX:-mrml}-acme"

services:
  certd:
    image: "mrml/certd:${MRML_ACME_VERSION:?set MRML_ACME_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21003:21003"
    group_add: ["21902", "21903"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=21003,gid=21003,mode=0700
    volumes:
      - "mrml-certd-state:/var/lib/mrml/certd:rw"
      - "mrml-certd-publications:/var/lib/mrml/publications:rw"
      - type: volume
        source: mrml-runtime-certd-gitd
        target: /run/mrml/certd-gitd
        volume: {nocopy: true}
      - type: volume
        source: mrml-runtime-certd-acmed
        target: /run/mrml/certd-acmed
        volume: {nocopy: true}
      - "mrml-certd-secrets:/run/secrets:ro"
      - "mrml-certd-config:/etc/mrml/certd:ro"
    healthcheck:
      test: [CMD, /usr/bin/mrml-certd, lifecycle-health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  acmed:
    image: "mrml/acmed:${MRML_ACME_VERSION:?set MRML_ACME_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21004:21004"
    group_add: ["21903"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    depends_on:
      certd: {condition: service_healthy}
    networks: [acme-egress]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=21004,gid=21004,mode=0700
    volumes:
      - "mrml-acmed-state:/var/lib/mrml/acmed:rw"
      - "mrml-acmed-challenges:/var/lib/mrml/challenges:rw"
      - type: volume
        source: mrml-runtime-certd-acmed
        target: /run/mrml/certd-acmed
        volume: {nocopy: true}
      - "mrml-acmed-secrets:/run/secrets:ro"
      - "mrml-acmed-config:/etc/mrml/acmed:ro"
    healthcheck:
      test: [CMD, /usr/bin/mrml-acmed, health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  acme-egress:
    driver: bridge
    internal: false

volumes:
  mrml-certd-state:
    name: "${MRML_VOLUME_PREFIX:-mrml}-certd-state"
  mrml-certd-publications:
    name: "${MRML_VOLUME_PREFIX:-mrml}-certd-publications"
  mrml-acmed-state:
    name: "${MRML_VOLUME_PREFIX:-mrml}-acmed-state"
  mrml-acmed-challenges:
    name: "${MRML_VOLUME_PREFIX:-mrml}-acmed-challenges"
  mrml-runtime-certd-gitd:
    name: "${MRML_VOLUME_PREFIX:-mrml}-runtime-certd-gitd"
  mrml-runtime-certd-acmed:
    name: "${MRML_VOLUME_PREFIX:-mrml}-runtime-certd-acmed"
  mrml-certd-secrets:
    name: "${MRML_VOLUME_PREFIX:-mrml}-certd-secrets"
  mrml-certd-config:
    name: "${MRML_VOLUME_PREFIX:-mrml}-certd-config"
  mrml-acmed-secrets:
    name: "${MRML_VOLUME_PREFIX:-mrml}-acmed-secrets"
  mrml-acmed-config:
    name: "${MRML_VOLUME_PREFIX:-mrml}-acmed-config"
