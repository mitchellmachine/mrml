services:
  git-credential-agent:
    image: "mrml/git-credential-agent:${MRML_GIT_VERSION:?set MRML_GIT_VERSION}"
    platform: linux/amd64
    pull_policy: never
    user: "21007:21007"
    group_add: ["21907"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 64m
    cpus: 0.5
    restart: unless-stopped
    stop_grace_period: 10s
    ulimits:
      nofile: {soft: 128, hard: 128}
    logging:
      driver: local
      options: {max-size: 5m, max-file: "3"}
    volumes:
      - type: volume
        source: mrml-git-credential-agent-token
        target: /run/secrets/token
        read_only: true
        volume: {subpath: token}
      - type: volume
        source: mrml-git-credential-agent-channel
        target: /run/secrets/channel
        read_only: true
        volume: {subpath: channel}
      - type: volume
        source: mrml-runtime-git-credential-agent
        target: /run/mrml/git-credential-agent
        volume: {nocopy: true}
    command:
      - serve
      - /run/mrml/git-credential-agent/agent.sock
      - /run/secrets/channel
      - /run/secrets/token
      - "${MRML_GIT_CLIENT_UID:?set MRML_GIT_CLIENT_UID}"
      - "${MRML_GIT_CLIENT_GID:?set MRML_GIT_CLIENT_GID}"
      - "21007"
      - "21907"
      - "${MRML_GIT_CREDENTIAL_HOST:?set MRML_GIT_CREDENTIAL_HOST}"
      - "${MRML_GIT_CREDENTIAL_PORT:-443}"
      - "${MRML_GIT_CREDENTIAL_REPOSITORY_PATH:?set MRML_GIT_CREDENTIAL_REPOSITORY_PATH}"
      - "${MRML_GIT_CREDENTIAL_ACTIONS:-read-write}"
      - "${MRML_GIT_CREDENTIAL_GENERATION:?set MRML_GIT_CREDENTIAL_GENERATION}"

volumes:
  mrml-git-credential-agent-token:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-credential-agent-token"
  mrml-git-credential-agent-channel:
    name: "${MRML_VOLUME_PREFIX:-mrml}-git-credential-agent-channel"
  mrml-runtime-git-credential-agent:
    name: "${MRML_VOLUME_PREFIX:-mrml}-runtime-git-credential-agent"
