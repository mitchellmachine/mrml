[package]
name = "mrml-rustc-driver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Dependency-free command-line compiler driver for MRML Rust"

[[bin]]
name = "mrml-rustc"
path = "src/main.rs"

[dependencies]
mrml-error = { path = "../../packages/libraries/error" }
mrml-runtime = { path = "../../packages/libraries/runtime" }
mrml-rustc = { path = "../core" }
