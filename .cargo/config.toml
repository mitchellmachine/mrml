# Workspace build configuration intentionally stays toolchain-native. CUDA PTX
# is compiled by nightly rustc in mrml-tensor/build.rs and requires no C++ shim.

[unstable]
panic-abort-tests = true

[target.x86_64-pc-windows-gnullvm]
linker = "rust-lld"
rustflags = [
    "-C", "panic=abort",
    "-C", "target-feature=+crt-static",
    "--cfg", "mrml_stage_zero",
    "--check-cfg=cfg(mrml_stage_zero)",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "panic=abort",
    "--cfg", "mrml_stage_zero",
    "--check-cfg=cfg(mrml_stage_zero)",
]

[target.x86_64-unknown-uefi]
rustflags = [
    "-C", "panic=abort",
    "-C", "link-arg=/debug:none",
    "-C", "link-arg=/timestamp:0",
]
