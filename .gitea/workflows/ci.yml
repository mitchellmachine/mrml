name: MRML canonical gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked
      - run: ./target/debug/mrml manifest check
      - run: ./target/debug/mrml manifest lock --check
      - run: ./target/debug/mrml audit --all --target native --output structured
      - run: ./target/debug/mrml assurance check
      - run: cargo clippy --locked --all-targets -- -D warnings

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked
      - run: ./target/debug/mrml test --all --target linux --release
      - run: ./target/debug/mrml test org.mrml.library.acme --target linux --release
      - run: ./target/debug/mrml test org.mrml.service.certificate --target linux --release
      - run: ./target/debug/mrml test org.mrml.test.security-fuzz --target linux --release
      - run: ./target/debug/mrml build org.mrml.service.certificate --target native --release

  certificate-interfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked
      - run: ./target/debug/mrml interface generate-rust packages/interfaces/org.mrml.interface.certificate.signing/1.mri /tmp/certificate-signing.rs
      - run: diff -u packages/interfaces/org.mrml.interface.certificate.signing/1.rs /tmp/certificate-signing.rs
      - run: ./target/debug/mrml interface generate-rust packages/interfaces/org.mrml.interface.certificate.identity/1.mri /tmp/certificate-identity.rs
      - run: diff -u packages/interfaces/org.mrml.interface.certificate.identity/1.rs /tmp/certificate-identity.rs
      - run: ./target/debug/mrml interface generate-rust packages/interfaces/org.mrml.interface.certificate.challenge/1.mri /tmp/certificate-challenge.rs
      - run: diff -u packages/interfaces/org.mrml.interface.certificate.challenge/1.rs /tmp/certificate-challenge.rs
      - run: ./target/debug/mrml interface generate-rust packages/interfaces/org.mrml.interface.certificate.lifecycle/1.mri /tmp/certificate-lifecycle.rs
      - run: diff -u packages/interfaces/org.mrml.interface.certificate.lifecycle/1.rs /tmp/certificate-lifecycle.rs

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked
      - run: .\target\debug\mrml.exe test --all --target windows --release

  windows-under-wine-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install --yes wine64
      - run: bash -lc 'source tools/toolchain/setup-wine-oracle.sh && WINEDEBUG=-all RUSTFLAGS="-C link-arg=/stack:16777216 --cfg mrml_stage_zero --check-cfg=cfg(mrml_stage_zero)" wine cargo.exe +"$MRML_WINE_TOOLCHAIN" build --locked'
      - run: bash -lc 'source tools/toolchain/setup-wine-oracle.sh && WINEDEBUG=-all wine target/debug/mrml.exe test org.mrml.library.acme --target windows --release'
      - run: bash -lc 'source tools/toolchain/setup-wine-oracle.sh && WINEDEBUG=-all wine target/debug/mrml.exe test org.mrml.service.certificate --target windows --release'
      - run: bash -lc 'source tools/toolchain/setup-wine-oracle.sh && WINEDEBUG=-all wine target/debug/mrml.exe test org.mrml.test.security-fuzz --target windows --release'

  cuda-compile-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked
      - run: ./target/debug/mrml build org.mrml.library.tensor --target linux --feature-profile cuda
      - run: ./target/debug/mrml build org.mrml.library.tensor --target windows --feature-profile cuda
      - run: ./target/debug/mrml build org.mrml.library.tensor --target cuda-nvidia --gpu-arch sm_100
      - run: ./target/debug/mrml build org.mrml.library.tensor --target cuda-nvidia --gpu-arch sm_120
