name: MRML Linux AddressSanitizer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  address-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked
      - run: ./target/debug/mrml test --all --target linux --sanitizer address
      - run: ./target/debug/mrml test org.mrml.library.acme --target linux --sanitizer address
      - run: ./target/debug/mrml test org.mrml.service.certificate --target linux --sanitizer address
