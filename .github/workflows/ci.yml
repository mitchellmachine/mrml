name: Native CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy and stage-zero tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-08-24 --profile minimal --component clippy,rustfmt,rust-src --target nvptx64-nvidia-cuda,x86_64-unknown-none,x86_64-unknown-uefi
      - name: Build locked stage-zero frontend
        run: cargo build --locked
      - name: Test stage-zero policy implementation
        run: cargo test --locked
      - name: Check stage-zero Rust formatting
        run: cargo fmt --all -- --check
      - name: Check stage-zero Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check native workspace graph
        run: ./target/debug/mrml doctor
      - name: Check Manifest V2 syntax
        run: ./target/debug/mrml manifest check
      - name: Check canonical manifest formatting
        run: ./target/debug/mrml manifest fmt --check
      - name: Check native workspace lock
        run: ./target/debug/mrml manifest lock --check
      - name: Audit exact repository build inputs
        run: ./target/debug/mrml audit --all --target native --output structured
      - name: Check generated status, unsafe policy, links, and workflow gates
        run: ./target/debug/mrml assurance check

  linux:
    name: Linux full native tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-08-24 --profile minimal --component rust-src --target nvptx64-nvidia-cuda,x86_64-unknown-none,x86_64-unknown-uefi
      - name: Build locked stage-zero frontend
        run: cargo build --locked
      - name: Run every Linux-compatible native test in release mode
        run: ./target/debug/mrml test --all --target linux --release
      - name: Build the host CUDA feature profile without device authority
        run: ./target/debug/mrml build org.mrml.library.tensor --target linux --feature-profile cuda --gpu-arch sm_80
      - name: Build the CUDA PTX target without device authority
        run: ./target/debug/mrml build org.mrml.library.tensor --target cuda-nvidia --gpu-arch sm_80

  windows:
    name: Windows gnullvm full native tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned gnullvm Rust toolchain
        shell: pwsh
        run: |
          rustup set default-host x86_64-pc-windows-gnullvm
          rustup toolchain install nightly-2026-08-24-x86_64-pc-windows-gnullvm --profile minimal --component rust-mingw,rust-src --target nvptx64-nvidia-cuda,x86_64-unknown-none,x86_64-unknown-uefi
          rustup default nightly-2026-08-24-x86_64-pc-windows-gnullvm
      - name: Build locked stage-zero frontend
        run: cargo +nightly-2026-08-24-x86_64-pc-windows-gnullvm build --locked
      - name: Run every Windows-compatible native test in release mode
        run: .\target\debug\mrml.exe test --all --target windows --release
      - name: Build the host CUDA feature profile without device authority
        run: .\target\debug\mrml.exe build org.mrml.library.tensor --target windows --feature-profile cuda --gpu-arch sm_80
      - name: Build the CUDA PTX target without device authority
        run: .\target\debug\mrml.exe build org.mrml.library.tensor --target cuda-nvidia --gpu-arch sm_80
