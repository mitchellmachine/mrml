name: MRML Linux AddressSanitizer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  address-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev
      - run: bash tools/toolchain/setup-oracle.sh
      - run: cargo build --locked
      - run: ./target/debug/mrml test --all --target linux --sanitizer address --output structured --keep-going
