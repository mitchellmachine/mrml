name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-zero-address-sanitizer:
    name: Linux stage-zero AddressSanitizer tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-08-24 --profile minimal --component rust-src
      - name: Run locked frontend tests under AddressSanitizer
        env:
          CARGO_TARGET_DIR: target/asan-stage-zero
          RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
        run: cargo test --locked --target x86_64-unknown-linux-gnu

  native-address-sanitizer:
    name: Linux full native AddressSanitizer tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-08-24 --profile minimal --component rust-src --target x86_64-unknown-none,x86_64-unknown-uefi
      - name: Build locked stage-zero frontend
        run: cargo build --locked
      - name: Run every Linux-compatible native test under AddressSanitizer
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
        run: ./target/debug/mrml test --all --target linux --sanitizer address
