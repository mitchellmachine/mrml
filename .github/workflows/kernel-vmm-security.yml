name: Kernel and VMM security

on:
  push:
    branches: [main]
    paths:
      - "packages/system/kernel/**"
      - "packages/system/vmm/**"
      - "packages/libraries/runtime/**"
      - "packages/libraries/linux/**"
      - "packages/libraries/windows/**"
      - ".github/workflows/kernel-vmm-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/system/kernel/**"
      - "packages/system/vmm/**"
      - "packages/libraries/runtime/**"
      - "packages/libraries/linux/**"
      - "packages/libraries/windows/**"
      - ".github/workflows/kernel-vmm-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-vmm-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-kvm:
    name: Linux kernel and KVM security tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal --component rust-src
      - name: Build locked stage-zero frontend
        run: cargo build --locked
      - name: Test kernel security state machines
        run: ./target/debug/mrml test org.mrml.system.kernel --target linux --release
      - name: Test KVM cancellation and native boundaries
        run: ./target/debug/mrml test org.mrml.system.vmm-kvm --target linux --release

  windows-whp:
    name: Windows kernel and WHP security tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned gnullvm Rust toolchain
        shell: pwsh
        run: |
          rustup set default-host x86_64-pc-windows-gnullvm
          rustup toolchain install nightly-2026-08-29-x86_64-pc-windows-gnullvm --profile minimal --component rust-mingw,rust-src
          rustup default nightly-2026-08-29-x86_64-pc-windows-gnullvm
      - name: Build locked stage-zero frontend
        run: cargo +nightly-2026-08-29-x86_64-pc-windows-gnullvm build --locked
      - name: Test kernel security state machines
        run: .\target\debug\mrml.exe test org.mrml.system.kernel --target windows --release
      - name: Test WHP cancellation and native boundaries
        run: .\target\debug\mrml.exe test org.mrml.system.vmm-whp --target windows --release
