name: Manifest V2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Linux
            os: ubuntu-latest
            toolchain: nightly-2026-08-24-x86_64-unknown-linux-gnu
            components: rustfmt,llvm-tools
            mrml: target/debug/mrml
            host_target: linux
            math_artifact: target/mrml-native/linux/debug/libmrml_math.rlib
            vmm: org.mrml.tool.vmm-kvm-run
          - host: Windows GNU/LLVM
            os: windows-latest
            toolchain: nightly-2026-08-24-x86_64-pc-windows-gnullvm
            components: rustfmt,rust-mingw
            mrml: target/debug/mrml.exe
            host_target: windows
            math_artifact: target/mrml-native/windows/debug/libmrml_math.rlib
            vmm: org.mrml.tool.vmm-whp-run
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install exact stage-zero toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component "${{ matrix.components }}"

      - name: Bootstrap and test mrml
        shell: bash
        run: |
          cargo +"${{ matrix.toolchain }}" build --locked --bin mrml
          cargo +"${{ matrix.toolchain }}" test --locked --bin mrml

      - name: Check Manifest V2
        shell: bash
        run: |
          "${{ matrix.mrml }}" manifest check

      - name: Check canonical manifest formatting
        shell: bash
        run: |
          "${{ matrix.mrml }}" manifest fmt --check

      - name: Check separated lock graphs
        shell: bash
        run: |
          "${{ matrix.mrml }}" manifest lock --check

      - name: Audit declared build inputs
        shell: bash
        run: |
          "${{ matrix.mrml }}" audit --output structured

      - name: Reject active Manifest V1 declarations
        shell: bash
        run: |
          if git grep -n -E '^(declarations[[:space:]]*=|.*(component|rust-action|rust-test|rust-feature-set|rust-example|rust-bench)\|)' -- ':(glob)**/mrml.toml'; then
            echo 'active Manifest V1 declaration found' >&2
            exit 1
          fi

      - name: Build representative native component without Cargo
        shell: bash
        run: |
          if ! output=$("${{ matrix.mrml }}" build org.mrml.library.math --target native 2>&1); then
            summary=$(printf '%s' "$output" | tail -n 20 | tr '\n' ' ')
            echo "::error title=MRML native build failed::$summary"
            exit 1
          fi
          printf '%s\n' "$output"

      - name: Test through the MRML-native frontend
        shell: bash
        run: |
          "${{ matrix.mrml }}" test org.mrml.library.math --target "${{ matrix.host_target }}"

      - name: Create and verify a canonical package
        shell: bash
        run: |
          "${{ matrix.mrml }}" package create org.mrml.library.math library 1 x86_64 library "${{ matrix.math_artifact }}" target/ci-math.package
          "${{ matrix.mrml }}" package verify target/ci-math.package --output structured

      - name: Compile the host VMM runner
        shell: bash
        run: |
          "${{ matrix.mrml }}" build "${{ matrix.vmm }}" --target "${{ matrix.host_target }}"
