[package]
name = "mrml-av1"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mrml-runtime = { path = "../../packages/libraries/runtime" }

[features]
default = []
nvidia = ["dep:mrml-linux", "dep:mrml-windows"]

[target.'cfg(unix)'.dependencies]
mrml-linux = { path = "../../packages/libraries/linux", optional = true }

[target.'cfg(windows)'.dependencies]
mrml-windows = { path = "../../packages/libraries/windows", optional = true }
