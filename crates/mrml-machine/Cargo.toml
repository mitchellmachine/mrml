[package]
name = "mrml-machine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "mrml-machine"
path = "src/main.rs"

[features]
default = ["auto"]
auto = ["mrml-agent/auto"]
cuda = ["mrml-agent/cuda"]
vulkan = ["mrml-agent/vulkan"]
hipblas = ["mrml-agent/hipblas"]
sycl = ["mrml-agent/sycl"]

[dependencies]
mrml-agent = { path = "../mrml-agent", default-features = false, features = ["runtime"] }
mrml-json = { path = "../../packages/libraries/json" }
mrml-tools = { path = "../../tools/host" }
mrml-error = { path = "../../packages/libraries/error" }
mrml-runtime = { path = "../../packages/libraries/runtime" }
