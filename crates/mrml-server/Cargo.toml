[package]
name = "mrml-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "mrml-server"
path = "src/main.rs"

[features]
default = ["auto"]
auto = ["mrml-agent/auto"]
cuda = ["mrml-agent/cuda"]
vulkan = ["mrml-agent/vulkan"]

[dependencies]
mrml-agent = { path = "../mrml-agent", default-features = false, features = ["runtime"] }
mrml-terminal-style = { path = "../../packages/libraries/terminal-style" }
mrml-error = { path = "../../packages/libraries/error" }
mrml-model = { path = "../mrml-model" }
mrml-json = { path = "../../packages/libraries/json" }
mrml-tools = { path = "../mrml-tools" }
mrml-runtime = { path = "../../packages/libraries/runtime" }
mrml-tls = { path = "../../packages/libraries/tls" }
