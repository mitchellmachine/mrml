[workspace]

[package]
name = "mrml-vbs-host"
version = "0.1.0"
edition = "2024"
authors = ["Mitchell Renouf <mitchell@localhost>"]
license = "CC0-1.0"
description = "Original dependency-free MRML VBS enclave lifecycle probe"

[[bin]]
name = "mrml-vbs-host"
path = "src/main.rs"
test = false
bench = false

[dependencies]
mrml-error = { path = "../../crates/mrml-error" }
mrml-kernel = { path = "../../crates/mrml-kernel" }
mrml-runtime = { path = "../../crates/mrml-runtime" }
mrml-whp = { path = "../../crates/mrml-whp" }
mrml-windows = { path = "../../packages/libraries/windows" }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
