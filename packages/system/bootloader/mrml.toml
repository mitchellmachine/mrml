name = "deadline_receive_cancel_denied_probe"
targets = ["UEFI"]

[[feature_profile]]
features = ["service-probe", "deadline-receive-probe", "deadline-receive-cancel-probe", "deadline-receive-cancel-replay-probe"]
name = "deadline_receive_cancel_replay_probe"
targets = ["UEFI"]

[[feature_profile]]
features = ["service-probe", "component-service-probe", "smp-probe", "emulated-ap-timing", "ap-startup-trace"]
name = "kvm_component_service_smp_probe"
targets = ["UEFI"]

[[feature_profile]]
