[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.system.bootloader"
kind = "bootloader"
name = "mrml-kernel-image"
profile = "uefi"

[[target]]
arch = "x86_64"
environment = "uefi"

[[feature]]
name = "ap-startup-trace"

[[feature]]
name = "application-probe"

[[feature]]
name = "ahci-service-manager-probe"

[[feature]]
name = "block-guest-driver-probe"

[[feature]]
name = "block-service-probe"

[[feature]]
name = "component-service-probe"

[[feature]]
name = "deadline-receive-probe"

[[feature]]
name = "deadline-receive-message-probe"

[[feature]]
name = "deadline-receive-cancel-probe"

[[feature]]
name = "deadline-receive-cancel-denied-probe"

[[feature]]
name = "deadline-receive-cancel-replay-probe"

[[feature]]
name = "emulated-ap-timing"

[[feature]]
name = "fault-probe"

[[feature]]
name = "gpu-benchmark"

[[feature]]
name = "invalid-return-probe"

[[feature]]
name = "buffer-drift-probe"

[[feature]]
name = "kernel-image"

[[feature]]
name = "pci-configuration-probe"

[[feature]]
name = "preemption-probe"

[[feature]]
name = "production-policy"

[[feature]]
name = "service-preemption-probe"

[[feature]]
name = "fat32-data-probe"

[[feature]]
name = "fat32-restart-probe"

[[feature]]
name = "uefi-fat32-restart-probe"

[[feature]]
name = "fat32-ready-probe"

[[feature]]
name = "service-probe"

[[feature]]
name = "certificate-service-probe"

[[feature]]
name = "service-restart-request-probe"

[[feature]]
name = "smp-ipi-probe"

[[feature]]
name = "smp-periodic-balance-probe"

[[feature]]
name = "smp-probe"

[[feature]]
name = "smp-scheduler-probe"

[[feature]]
name = "smp-service-migration-probe"

[[feature]]
name = "timer-probe"

[[feature]]
name = "uefi-service-preemption-probe"

[[feature]]
name = "user-probe"

[[feature]]
name = "vmx-root-probe"

[[feature]]
name = "whp-gpu-benchmark"

[[feature]]
name = "whp-smp-ipi-probe"

[[feature]]
name = "whp-smp-periodic-balance-probe"

[[feature]]
name = "whp-smp-probe"

[[feature]]
name = "whp-smp-scheduler-probe"

[[feature]]
name = "whp-smp-service-migration-probe"

[[artifact]]
kind = "bin"
name = "mrml-kernel-pe"

[rust]
crate_name = "mrml_kernel_image"
crate_type = "none"
source = "-"

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"

[[dependency]]
alias = "mrml_interface_storage_block_provider_v1"
compile_name = "mrml-interface-storage-block-provider-v1"
package = "org.mrml.interface.storage.block-provider"
scope = "compile"

[[dependency]]
alias = "mrml_interface_storage_filesystem_v3"
compile_name = "mrml-interface-storage-filesystem-v3"
package = "org.mrml.interface.storage.filesystem"
scope = "compile"

[[dependency]]
alias = "mrml_storage_ahci"
compile_name = "mrml-storage-ahci"
package = "org.mrml.library.storage.ahci"
scope = "compile"

[[binary]]
crate_name = "mrml_kernel_pe"
output = "mrml-kernel-pe"
self_extern = false
source = "packages/system/bootloader/src/main.rs"

[[feature_set]]
features = ["kernel-image"]
targets = ["UEFI"]

[[feature_profile]]
features = ["vmx-root-probe"]
name = "vmx_root_probe"
targets = ["UEFI"]

[[feature_profile]]
features = ["application-probe"]
name = "application_probe"
targets = ["UEFI"]

[[feature_profile]]
features = ["pci-configuration-probe"]
name = "pci_configuration_probe"
targets = ["UEFI"]

[[feature_profile]]
features = ["service-probe"]
name = "service_probe"
targets = ["UEFI"]

[[feature_profile]]
features = ["service-probe", "certificate-service-probe"]
