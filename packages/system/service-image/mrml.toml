[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.system.service-image"
kind = "service"
name = "mrml-service-image"
profile = "system-service"

[isolation]
default = "native-service"
minimum = "native-service"
supported = ["native-service"]

[[target]]
arch = "x86_64"
environment = "mrml"

[[feature]]
name = "block-service-loop"

[[feature]]
name = "invalid-return-probe"

[[feature]]
name = "buffer-drift-probe"

[[feature]]
name = "deadline-receive-probe"

[[feature]]
name = "deadline-receive-message-probe"

[[feature]]
name = "preemption-probe"

[[artifact]]
kind = "bin"
name = "mrml-service-pe"

[rust]
crate_name = "mrml_service_image"
crate_type = "none"
source = "-"

[[dependency]]
alias = "mrml_config"
compile_name = "mrml-config"
package = "org.mrml.service.config"
scope = "compile"

[[dependency]]
alias = "mrml_crypto"
compile_name = "mrml-crypto"
package = "org.mrml.library.crypto"
provider_profile = "core"
scope = "compile"

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"

[[dependency]]
alias = "mrml_deployment"
compile_name = "mrml-deployment"
package = "org.mrml.service.deployment"
scope = "compile"

[[dependency]]
alias = "mrml_package_format"
compile_name = "mrml-package-format"
package = "org.mrml.library.package-format"
scope = "compile"

[[dependency]]
alias = "mrml_storage"
compile_name = "mrml-storage"
package = "org.mrml.service.storage"
scope = "compile"

[[binary]]
crate_name = "mrml_service_pe"
output = "mrml-service-pe"
self_extern = false
source = "packages/system/service-image/src/main.rs"

[[feature_set]]
features = []
targets = ["MRML_NATIVE"]

[[feature_profile]]
features = ["block-service-loop"]
name = "block_service_loop"
targets = ["MRML_NATIVE"]

[[feature_profile]]
features = ["invalid-return-probe"]
name = "invalid_return_probe"
targets = ["MRML_NATIVE"]

[[feature_profile]]
features = ["buffer-drift-probe"]
name = "buffer_drift_probe"
targets = ["MRML_NATIVE"]

[[feature_profile]]
features = ["deadline-receive-probe"]
name = "deadline_receive_probe"
targets = ["MRML_NATIVE"]

[[feature_profile]]
features = ["deadline-receive-probe", "deadline-receive-message-probe"]
name = "deadline_receive_message_probe"
targets = ["MRML_NATIVE"]

[[target_triple]]
target = "MRML_NATIVE"
triple = "x86_64-unknown-uefi"
