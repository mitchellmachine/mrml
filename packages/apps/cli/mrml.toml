[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.app.cli"
kind = "application"
name = "mrml-cli"
profile = "host-tool"

[isolation]
default = "native-process"
minimum = "native-process"
supported = ["native-process"]

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[feature]]
name = "auto"

[[feature]]
name = "cuda"

[[feature]]
name = "default"

[[feature]]
name = "hipblas"

[[feature]]
name = "sycl"

[[feature]]
name = "vulkan"

[[artifact]]
kind = "bin"
name = "mrml-cli"

[rust]
crate_name = "mrml_cli_action"
crate_type = "none"
source = "-"

[[dependency]]
alias = "mrml_agent"
compile_name = "mrml-agent"
package = "org.mrml.library.agent"
provider_profile = "auto"
scope = "compile"

[[dependency]]
alias = "mrml_error"
compile_name = "mrml-error"
package = "org.mrml.library.error"
scope = "compile"

[[dependency]]
alias = "mrml_runtime"
compile_name = "mrml-runtime"
package = "org.mrml.library.runtime"
scope = "compile"

[[dependency]]
alias = "mrml_terminal_style"
compile_name = "mrml-terminal-style"
package = "org.mrml.library.terminal-style"
scope = "compile"

[[dependency]]
alias = "mrml_tools"
compile_name = "mrml-tools"
package = "org.mrml.tool.host"
scope = "compile"

[[feature_set]]
features = ["auto"]
targets = ["WINDOWS", "LINUX"]

[[binary]]
crate_name = "mrml_cli"
output = "mrml-cli"
self_extern = false
source = "packages/apps/cli/src/main.rs"
