[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.test.security-fuzz"
kind = "test"
name = "mrml-security-fuzz"
profile = "test"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_security_fuzz"

[rust]
crate_name = "mrml_security_fuzz"
crate_type = "lib"
source = "packages/tests/security-fuzz/src/lib.rs"

[[dependency]]
alias = "mrml_runtime"
compile_name = "mrml-runtime"
package = "org.mrml.library.runtime"
scope = "compile"

[[dependency]]
alias = "mrml_tensor"
compile_name = "mrml-tensor"
package = "org.mrml.library.tensor"
scope = "compile"

[[dependency]]
alias = "mrml_tls"
compile_name = "mrml-tls"
package = "org.mrml.library.tls"
scope = "compile"

[[dependency]]
alias = "mrml_zim"
compile_name = "mrml-zim"
package = "org.mrml.zim"
scope = "compile"
