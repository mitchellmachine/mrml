[manifest]
format = "mrml"
version = 2

[package]
default = true
id = "org.mrml.compiler.core"
kind = "compiler"
name = "mrml-rustc"
profile = "compiler"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "test"
name = "component_interface"

[[artifact]]
kind = "test"
name = "conformance"

[[artifact]]
kind = "lib"
name = "mrml_rustc"

[[artifact]]
kind = "test"
name = "rustc_nightly_replacements"

[[artifact]]
kind = "test"
name = "semantic_execution"

[rust]
crate_name = "mrml_rustc"
crate_type = "lib"
source = "packages/compiler/core/src/lib.rs"

[[test]]
name = "component_interface"
self_extern = true
source = "packages/compiler/core/tests/component_interface.rs"

[[test]]
name = "conformance"
self_extern = false
source = "packages/compiler/core/tests/conformance.rs"

[[test]]
name = "rustc_nightly_replacements"
self_extern = true
source = "packages/compiler/core/tests/rustc_nightly_replacements.rs"

[[test]]
name = "semantic_execution"
self_extern = true
source = "packages/compiler/core/tests/semantic_execution.rs"

[test_policy]
stack_bytes = 33554432

[[build_input]]
fingerprint = "fnv1a64:119cf59b03a62643"
id = "external-command.verify-oracle.rustup"
kind = "external-command"
line = 21
path = "packages/compiler/core/tests/semantic_execution.rs"
reason = "Resolve the pinned reference rustc executable used by the compiler semantic differential test harness."

[[build_input]]
fingerprint = "fnv1a64:e2365a97a0d780f8"
id = "external-command.subslice-then-index-bounds-report-isolated-traps.current-exe"
kind = "external-command"
line = 401
path = "packages/compiler/core/tests/semantic_execution.rs"
reason = "Launch the current semantic test binary in a child process so generated bounds traps cannot terminate the parent test harness."

[[build_input]]
fingerprint = "fnv1a64:19837a24a9fd678c"
id = "external-command.checked-overflow-reports-an-isolated-trap-exit.current-exe"
kind = "external-command"
line = 482
path = "packages/compiler/core/tests/semantic_execution.rs"
reason = "Launch the current semantic test binary in a child process so generated overflow traps cannot terminate the parent test harness."
