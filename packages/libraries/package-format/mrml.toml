[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.library.package-format"
kind = "library"
name = "mrml-package-format"
profile = "library"

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "uefi"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_package_format"

[rust]
crate_name = "mrml_package_format"
crate_type = "lib"
source = "packages/libraries/package-format/src/lib.rs"

[[dependency]]
alias = "mrml_crypto"
compile_name = "mrml-crypto"
package = "org.mrml.library.crypto"
provider_profile = "core"
scope = "compile"
