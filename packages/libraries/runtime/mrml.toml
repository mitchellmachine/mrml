[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.library.runtime"
kind = "library"
name = "mrml-runtime"
profile = "library"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_runtime"

[rust]
crate_name = "mrml_runtime"
crate_type = "lib"
source = "packages/libraries/runtime/src/lib.rs"

[[dependency]]
alias = "mrml_linux"
compile_name = "mrml-linux"
package = "org.mrml.library.linux"
scope = "compile"
targets = ["LINUX"]

[[dependency]]
alias = "mrml_windows"
compile_name = "mrml-windows"
package = "org.mrml.library.windows"
scope = "compile"
targets = ["WINDOWS"]

