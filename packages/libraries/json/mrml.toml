[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.library.json"
kind = "library"
name = "mrml-json"
profile = "library"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_json"

[rust]
crate_name = "mrml_json"
crate_type = "lib"
source = "packages/libraries/json/src/lib.rs"

[[dependency]]
alias = "mrml_runtime"
compile_name = "mrml-runtime"
package = "org.mrml.library.runtime"
scope = "compile"
