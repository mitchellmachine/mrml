[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.library.uefi"
kind = "library"
name = "mrml-uefi"
profile = "library"

[isolation]
default = "platform"
minimum = "platform"
supported = ["platform"]
runtime_class = "boot-only"
must_run = false
reason = "loader exits before userspace and before the VM substrate exists"

[[target]]
arch = "x86_64"
environment = "uefi"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[feature]]
name = "uefi-image"

[[feature]]
name = "package-boot"

[[artifact]]
kind = "lib"
name = "mrml_uefi"

[[artifact]]
kind = "bin"
name = "mrml-loader"

[rust]
crate_name = "mrml_uefi"
crate_type = "lib"
source = "packages/libraries/uefi/src/lib.rs"

[[dependency]]
alias = "mrml_crypto"
compile_name = "mrml-crypto"
package = "org.mrml.library.crypto"
provider_profile = "core"
scope = "compile"

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"

[[dependency]]
alias = "mrml_package_format"
compile_name = "mrml-package-format"
package = "org.mrml.library.package-format"
scope = "compile"

[[dependency]]
alias = "mrml_storage"
compile_name = "mrml-storage"
package = "org.mrml.service.storage"
scope = "compile"

[[binary]]
crate_name = "mrml_loader"
feature = "uefi-image"
output = "mrml-loader"
self_extern = true
source = "packages/libraries/uefi/src/main.rs"
targets = ["UEFI"]

[[feature_set]]
features = ["uefi-image"]
targets = ["UEFI"]

[[feature_profile]]
features = ["uefi-image", "package-boot"]
name = "package_boot"
targets = ["UEFI"]

[[feature_set]]
features = []
targets = ["WINDOWS", "LINUX"]

[[host_test]]
targets = ["WINDOWS", "LINUX"]

