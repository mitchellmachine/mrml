[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.library.math"
kind = "library"
name = "mrml-math"
profile = "library"

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[target]]
arch = "gpu"
environment = "gpu"
toolchain = "cuda-nvidia"

[[artifact]]
kind = "lib"
name = "mrml_math"

[rust]
crate_name = "mrml_math"
crate_type = "lib"
source = "packages/libraries/math/src/lib.rs"

[[build_input]]
kind = "native-link"
line = 3
path = "packages/libraries/math/src/lib.rs"
reason = "reviewed repository build input"

[[build_input]]
kind = "native-link"
line = 4
path = "packages/libraries/math/src/lib.rs"
reason = "reviewed repository build input"
