[manifest]
format = "mrml"
version = 2

[package]
default = true
id = "org.mrml.library.storage.fat32"
kind = "library"
name = "mrml-storage-fat32"
profile = "library"

[isolation]
default = "native-service"
minimum = "native-service"
must_run = true
runtime_class = "microvm-eligible"
supported = ["native-service", "microvm"]

[[provides]]
binding = "dynamic"
fingerprint = "cdf4ff47c6f987d7cf392eb641973f81de2b90ee8aa053b955265887823ae2dc"
form = "isolated-service"
generation = 3
interface = "org.mrml.interface.storage.filesystem"

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_storage_fat32"

[[artifact]]
kind = "bin"
name = "mrml-fat32-service"

[rust]
crate_name = "mrml_storage_fat32"
crate_type = "lib"
source = "packages/libraries/storage-fat32/src/lib.rs"

[[binary]]
crate_name = "mrml_fat32_service"
output = "mrml-fat32-service"
self_extern = true
source = "packages/libraries/storage-fat32/src/service_main.rs"
targets = ["MRML_NATIVE"]

[[target_triple]]
target = "MRML_NATIVE"
triple = "x86_64-unknown-uefi"

[[dependency]]
alias = "mrml_interface_storage_block_provider_v1"
compile_name = "mrml-interface-storage-block-provider-v1"
package = "org.mrml.interface.storage.block-provider"
scope = "compile"

[[dependency]]
alias = "mrml_interface_storage_filesystem_v3"
compile_name = "mrml-interface-storage-filesystem-v3"
package = "org.mrml.interface.storage.filesystem"
scope = "compile"

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"

[[host_test]]
targets = ["WINDOWS", "LINUX"]
