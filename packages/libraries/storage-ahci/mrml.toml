[manifest]
format = "mrml"
version = 2

[package]
default = true
id = "org.mrml.library.storage.ahci"
kind = "library"
name = "mrml-storage-ahci"
profile = "library"

[isolation]
default = "native-service"
minimum = "native-service"
must_run = true
runtime_class = "microvm-eligible"
supported = ["native-service", "microvm"]

[[provides]]
binding = "dynamic"
fingerprint = "1bde6037dfde7687b088296e135dd5c7a2406d001250c731165eef8cd817cf51"
form = "isolated-service"
generation = 1
interface = "org.mrml.interface.storage.block-provider"

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[target]]
arch = "x86_64"
environment = "uefi"

[[artifact]]
kind = "lib"
name = "mrml_storage_ahci"

[rust]
crate_name = "mrml_storage_ahci"
crate_type = "lib"
source = "packages/libraries/storage-ahci/src/lib.rs"

[[dependency]]
alias = "mrml_interface_storage_block_provider_v1"
compile_name = "mrml-interface-storage-block-provider-v1"
package = "org.mrml.interface.storage.block-provider"
scope = "compile"

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"

[[host_test]]
targets = ["WINDOWS", "LINUX"]

[test_policy]
stack_bytes = 67108864
