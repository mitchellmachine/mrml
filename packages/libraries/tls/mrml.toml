[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.library.tls"
kind = "library"
name = "mrml-tls"
profile = "library"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_tls"

[rust]
crate_name = "mrml_tls"
crate_type = "lib"
source = "packages/libraries/tls/src/lib.rs"

[[dependency]]
alias = "mrml_crypto"
compile_name = "mrml-crypto"
package = "org.mrml.library.crypto"
scope = "compile"

[[dependency]]
alias = "mrml_runtime"
compile_name = "mrml-runtime"
package = "org.mrml.library.runtime"
scope = "compile"
