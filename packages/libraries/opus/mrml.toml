[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.library.opus"
kind = "library"
name = "mrml-opus"
profile = "library"

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "example"
name = "inspect_range"

[[artifact]]
kind = "lib"
name = "mrml_opus"

[[artifact]]
kind = "example"
name = "opus_range_diff"

[[artifact]]
kind = "example"
name = "rfc8251_audit"

[rust]
crate_name = "mrml_opus"
crate_type = "lib"
source = "packages/libraries/opus/src/lib.rs"

[[dependency]]
alias = "mrml_math"
compile_name = "mrml-math"
package = "org.mrml.library.math"
scope = "compile"

[[example]]
name = "inspect_range"
source = "packages/libraries/opus/examples/inspect_range.rs"

[[example]]
name = "opus_range_diff"
source = "packages/libraries/opus/examples/opus_range_diff.rs"

[[example]]
name = "rfc8251_audit"
source = "packages/libraries/opus/examples/rfc8251_audit.rs"

[[build_input]]
kind = "native-link"
line = 15
path = "packages/libraries/opus/examples/opus_range_diff.rs"
reason = "reviewed repository build input"
