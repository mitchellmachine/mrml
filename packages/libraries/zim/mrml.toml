[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.zim"
kind = "library"
name = "mrml-zim"
profile = "library"

[isolation]
default = "in-process"
maximum = "microvm"
minimum = "in-process"
must_run = true
runtime_class = "microvm-eligible"
supported = ["in-process", "native-service", "microvm"]

[[requires]]
binding = "dynamic"
fingerprint = "6a62bdd594af284f51edc1734aa15851e5de37ef7e21103b665454c743e2126c"
form = "isolated-service"
generation = 3
interface = "org.mrml.interface.compression.zstd"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[target]]
arch = "x86_64"
environment = "mrml"

[[artifact]]
kind = "lib"
name = "mrml_zim"

[[artifact]]
kind = "bin"
name = "mrml-zim-interface-probe"

[rust]
crate_name = "mrml_zim"
crate_type = "lib"
source = "packages/libraries/zim/src/lib.rs"

[[binary]]
crate_name = "mrml_zim_interface_probe"
output = "mrml-zim-interface-probe"
self_extern = false
source = "packages/libraries/zim/src/service_probe_main.rs"
targets = ["MRML_NATIVE"]

[[target_triple]]
target = "MRML_NATIVE"
triple = "x86_64-unknown-uefi"

[[dependency]]
alias = "mrml_interface_zstd_v3"
compile_name = "mrml-interface-zstd-v3"
package = "org.mrml.interface.compression.zstd"
scope = "compile"

[[dependency]]
alias = "mrml_runtime"
compile_name = "mrml-runtime"
package = "org.mrml.library.runtime"
scope = "compile"
targets = ["WINDOWS", "LINUX"]

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"
targets = ["MRML_NATIVE"]
