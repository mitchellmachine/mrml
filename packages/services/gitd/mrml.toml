[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.service.gitd"
kind = "service"
name = "mrml-gitd"
profile = "system-service"

[isolation]
default = "native-service"
minimum = "native-service"
must_run = true
runtime_class = "microvm-eligible"
supported = ["native-service", "microvm"]

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_gitd"

[[artifact]]
kind = "bin"
name = "mrml-gitd"

[[artifact]]
kind = "bin"
name = "mrml-git-backup"

[rust]
crate_name = "mrml_gitd"
crate_type = "lib"
source = "packages/services/gitd/src/lib.rs"

[[binary]]
crate_name = "mrml_gitd_hosted"
output = "mrml-gitd"
self_extern = true
source = "packages/services/gitd/src/main.rs"
targets = ["LINUX"]

[[binary]]
crate_name = "mrml_git_backup"
output = "mrml-git-backup"
self_extern = true
source = "packages/services/gitd/src/backup_main.rs"
targets = ["LINUX"]

[[dependency]]
alias = "mrml_crypto"
compile_name = "mrml-crypto"
package = "org.mrml.library.crypto"
provider_profile = "core"
scope = "compile"

[[dependency]]
alias = "mrml_certificate"
compile_name = "mrml-certd"
package = "org.mrml.service.certificate"
scope = "compile"

[[dependency]]
alias = "mrml_git"
compile_name = "mrml-git"
package = "org.mrml.tool.git"
scope = "compile"

[[dependency]]
alias = "mrml_http"
compile_name = "mrml-http"
package = "org.mrml.library.http"
scope = "compile"

[[dependency]]
alias = "mrml_openpgp"
compile_name = "mrml-openpgp"
package = "org.mrml.library.openpgp"
scope = "compile"

[[dependency]]
alias = "mrml_runtime"
compile_name = "mrml-runtime"
package = "org.mrml.library.runtime"
scope = "compile"

[[dependency]]
alias = "mrml_tls"
compile_name = "mrml-tls"
package = "org.mrml.library.tls"
scope = "compile"

[[dependency]]
alias = "mrml_git_authority"
compile_name = "mrml-git-authority"
package = "org.mrml.service.git-authority"
scope = "compile"

[[host_test]]
targets = ["LINUX"]

