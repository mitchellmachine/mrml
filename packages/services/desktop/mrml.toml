[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.service.desktop"
kind = "service"
name = "mrml-desktop"
profile = "system-service"

[isolation]
default = "microvm"
minimum = "microvm"
must_run = false
reason = "Bounded core and hosted tests; admitted guest entry and runtime transport are not wired"
runtime_class = "unsupported-blocker"
supported = ["microvm"]

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_desktop"

[rust]
crate_name = "mrml_desktop"
crate_type = "lib"
source = "packages/services/desktop/src/lib.rs"

[[artifact]]
kind = "bin"
name = "mrml-desktop-preview"

[[binary]]
crate_name = "mrml_desktop_preview"
output = "mrml-desktop-preview"
self_extern = true
source = "packages/services/desktop/src/preview.rs"
targets = ["WINDOWS", "LINUX"]

[[dependency]]
alias = "mrml_terminal_probe"
compile_name = "mrml-terminal-probe"
package = "org.mrml.app.terminal-probe"
scope = "compile"

[[dependency]]
alias = "mrml_input_ps2_keyboard"
compile_name = "mrml-input-ps2-keyboard"
package = "org.mrml.service.input-ps2-keyboard"
scope = "compile"

[[dependency]]
alias = "mrml_input_ps2_mouse"
compile_name = "mrml-input-ps2-mouse"
package = "org.mrml.service.input-ps2-mouse"
scope = "compile"

[[host_test]]
targets = ["WINDOWS", "LINUX"]
