[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.service.acme"
kind = "service"
name = "mrml-acmed"
profile = "system-service"

[isolation]
default = "microvm"
minimum = "microvm"
must_run = true
runtime_class = "microvm-eligible"
supported = ["microvm"]

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_acmed"

[[artifact]]
kind = "bin"
name = "mrml-acmed"

[rust]
crate_name = "mrml_acmed"
crate_type = "lib"
source = "packages/services/acme-worker/src/lib.rs"

[[binary]]
crate_name = "mrml_acmed_hosted"
output = "mrml-acmed"
self_extern = true
source = "packages/services/acme-worker/src/main.rs"
targets = ["LINUX"]

[[dependency]]
alias = "mrml_acme"
compile_name = "mrml-acme"
package = "org.mrml.library.acme"
scope = "compile"

[[dependency]]
alias = "mrml_certificate"
compile_name = "mrml-certd"
package = "org.mrml.service.certificate"
scope = "compile"

[[dependency]]
alias = "mrml_crypto"
compile_name = "mrml-crypto"
package = "org.mrml.library.crypto"
scope = "compile"

[[dependency]]
alias = "mrml_json"
compile_name = "mrml-json"
package = "org.mrml.library.json"
scope = "compile"

[[dependency]]
alias = "mrml_runtime"
compile_name = "mrml-runtime"
package = "org.mrml.library.runtime"
scope = "compile"

[[host_test]]
targets = ["LINUX"]

[test_policy]
stack_bytes = 8388608
