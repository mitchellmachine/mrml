[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.service.compositor"
kind = "service"
name = "mrml-compositor"
profile = "system-service"

[isolation]
default = "microvm"
minimum = "microvm"
must_run = true
runtime_class = "microvm-eligible"
supported = ["microvm"]

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_compositor"

[[artifact]]
kind = "bin"
name = "mrml-compositor-scanout-probe"

[rust]
crate_name = "mrml_compositor"
crate_type = "lib"
source = "packages/services/compositor/src/lib.rs"

[[binary]]
crate_name = "mrml_compositor_scanout_probe"
output = "mrml-compositor-scanout-probe"
self_extern = true
source = "packages/services/compositor/src/scanout_probe_main.rs"
targets = ["MRML_NATIVE"]

[[target_triple]]
target = "MRML_NATIVE"
triple = "x86_64-unknown-uefi"

[[dependency]]
alias = "mrml_interface_gui_surface_v1"
compile_name = "mrml-interface-gui-surface-v1"
package = "org.mrml.interface.gui.surface"
scope = "compile"

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"

[[dependency]]
alias = "mrml_boot_frame"
compile_name = "mrml-boot-frame"
package = "org.mrml.library.boot-frame"
scope = "compile"

[[projected_build]]
targets = ["UEFI"]

[[host_test]]
targets = ["WINDOWS", "LINUX"]
