[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.service.usb-storage"
kind = "service"
name = "mrml-usb-storage-service"
profile = "system-service"

[isolation]
default = "microvm"
minimum = "microvm"
must_run = false
reason = "USB block provider contract with hosted tests; live controller-bound guest and device projection are not wired"
runtime_class = "unsupported-blocker"
supported = ["microvm"]

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_usb_storage_service"

[rust]
crate_name = "mrml_usb_storage_service"
crate_type = "lib"
source = "packages/services/usb-storage/src/lib.rs"

[[dependency]]
alias = "mrml_storage_usb"
compile_name = "mrml-storage-usb"
package = "org.mrml.library.storage.usb"
scope = "compile"

[[dependency]]
alias = "mrml_usb_fat32_qtest"
compile_name = "mrml-usb-fat32-qtest"
package = "org.mrml.test.usb-fat32-qtest"
scope = "compile"
test_only = true

[[host_test]]
targets = ["LINUX"]
