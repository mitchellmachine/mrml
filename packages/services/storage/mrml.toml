[manifest]
format = "mrml"
version = 2

[package]
default = true
id = "org.mrml.service.storage"
kind = "service"
name = "mrml-storage"
profile = "system-service"

[isolation]
default = "native-service"
minimum = "native-service"
supported = ["native-service"]

[[requires]]
binding = "dynamic"
fingerprint = "1bde6037dfde7687b088296e135dd5c7a2406d001250c731165eef8cd817cf51"
form = "isolated-service"
generation = 1
interface = "org.mrml.interface.storage.block-provider"
multiplicity = "many"

[[requires]]
binding = "dynamic"
fingerprint = "58b11da30dcaa7eac23bf94ec176e2cd14e642b9c8449c6639c4383782346fbc"
form = "isolated-service"
generation = 1
interface = "org.mrml.interface.storage.filesystem"

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_storage"

[rust]
crate_name = "mrml_storage"
crate_type = "lib"
source = "packages/services/storage/src/lib.rs"

[[dependency]]
alias = "mrml_crypto"
compile_name = "mrml-crypto"
package = "org.mrml.library.crypto"
provider_profile = "core"
scope = "compile"

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"

[[dependency]]
alias = "mrml_interface_storage_block_provider_v1"
compile_name = "mrml-interface-storage-block-provider-v1"
package = "org.mrml.interface.storage.block-provider"
scope = "compile"

[[dependency]]
alias = "mrml_interface_storage_filesystem_v1"
compile_name = "mrml-interface-storage-filesystem-v1"
package = "org.mrml.interface.storage.filesystem"
scope = "compile"
test_only = true

[[dependency]]
alias = "mrml_storage_fat32"
compile_name = "mrml-storage-fat32"
package = "org.mrml.library.storage.fat32"
scope = "compile"
test_only = true

[[projected_build]]
targets = ["UEFI"]

[[host_test]]
targets = ["WINDOWS", "LINUX"]

[test_policy]
stack_bytes = 67108864
