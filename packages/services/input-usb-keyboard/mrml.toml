[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.service.input-usb-keyboard"
kind = "service"
name = "mrml-input-usb-keyboard"
profile = "system-service"

[isolation]
default = "microvm"
minimum = "microvm"
must_run = false
reason = "Input decoder core only; guest transport and trusted input routing are not wired"
runtime_class = "unsupported-blocker"
supported = ["microvm"]

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_input_usb_keyboard"

[rust]
crate_name = "mrml_input_usb_keyboard"
crate_type = "lib"
source = "packages/services/input-usb-keyboard/src/lib.rs"

[[host_test]]
targets = ["WINDOWS", "LINUX"]
