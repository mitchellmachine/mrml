[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.service.hardware-supervisor"
kind = "service"
name = "mrml-hardware-supervisor"
profile = "system-service"

[isolation]
default = "microvm"
minimum = "microvm"
must_run = false
reason = "Per-controller supervisor policy is tested; live inventory transport and driver microVM admission are not wired"
runtime_class = "unsupported-blocker"
supported = ["microvm"]

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_hardware_supervisor"

[rust]
crate_name = "mrml_hardware_supervisor"
crate_type = "lib"
source = "packages/services/hardware-supervisor/src/lib.rs"

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"

[[host_test]]
targets = ["WINDOWS", "LINUX"]
