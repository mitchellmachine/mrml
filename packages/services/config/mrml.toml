[manifest]
format = "mrml"
version = 2

[package]
default = true
id = "org.mrml.service.config"
kind = "service"
name = "mrml-config"
profile = "system-service"

[isolation]
default = "native-service"
minimum = "native-service"
must_run = true
runtime_class = "microvm-eligible"
supported = ["native-service", "microvm"]

[[target]]
arch = "x86_64"
environment = "mrml"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_config"

[rust]
crate_name = "mrml_config"
crate_type = "lib"
source = "packages/services/config/src/lib.rs"

[[dependency]]
alias = "mrml_crypto"
compile_name = "mrml-crypto"
package = "org.mrml.library.crypto"
provider_profile = "core"
scope = "compile"

[[dependency]]
alias = "mrml_deployment"
compile_name = "mrml-deployment"
package = "org.mrml.service.deployment"
scope = "compile"

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"

[[dependency]]
alias = "mrml_package_format"
compile_name = "mrml-package-format"
package = "org.mrml.library.package-format"
scope = "compile"

[[dependency]]
alias = "mrml_storage"
compile_name = "mrml-storage"
package = "org.mrml.service.storage"
scope = "compile"

[[host_test]]
targets = ["WINDOWS", "LINUX"]

[test_policy]
stack_bytes = 8388608
