[package]
name = "mrml-tensor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MRML Tensor: quantized tensor math, GGUF execution, and CUDA acceleration"

[features]
default = ["runtime"]
runtime = []
cuda = ["runtime"]

[dependencies]
mrml-math = { path = "../../libraries/math" }
mrml-runtime = { path = "../../libraries/runtime" }
mrml-kernel = { path = "../../../system/kernel" }

[build-dependencies]
mrml-runtime = { path = "../../libraries/runtime" }

[target.'cfg(windows)'.dependencies]
mrml-windows = { path = "../../libraries/windows" }

[target.'cfg(unix)'.dependencies]
mrml-linux = { path = "../../libraries/linux" }

[[bench]]
name = "hot_paths"
harness = false

[[example]]
name = "cuda_rust_compare"
required-features = ["cuda"]

[[example]]
name = "cuda_prefill_primitives"
required-features = ["cuda"]
