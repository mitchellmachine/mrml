[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.tool.sign"
kind = "tool"
name = "mrml-sign"
profile = "host-tool"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "bin"
name = "mrml-sign"

[rust]
crate_name = "mrml_sign_action"
crate_type = "none"
source = "-"

[[dependency]]
alias = "mrml_crypto"
compile_name = "mrml-crypto"
package = "org.mrml.library.crypto"
scope = "compile"

[[dependency]]
alias = "mrml_error"
compile_name = "mrml-error"
package = "org.mrml.library.error"
scope = "compile"

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"

[[dependency]]
alias = "mrml_runtime"
compile_name = "mrml-runtime"
package = "org.mrml.library.runtime"
scope = "compile"

[[dependency]]
alias = "mrml_storage"
compile_name = "mrml-storage"
package = "org.mrml.service.storage"
scope = "compile"

[[binary]]
crate_name = "mrml_sign"
output = "mrml-sign"
self_extern = false
source = "packages/tools/sign/src/main.rs"
