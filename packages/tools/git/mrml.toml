[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.tool.git"
kind = "tool"
name = "mrml-git"
profile = "host-tool"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_git"

[[artifact]]
kind = "bin"
name = "mrml-git"

[rust]
crate_name = "mrml_git"
crate_type = "lib"
source = "packages/tools/git/src/lib.rs"

[[dependency]]
alias = "mrml_error"
compile_name = "mrml-error"
package = "org.mrml.library.error"
scope = "compile"

[[dependency]]
alias = "mrml_runtime"
compile_name = "mrml-runtime"
package = "org.mrml.library.runtime"
scope = "compile"

[[dependency]]
alias = "mrml_ssh"
compile_name = "mrml-ssh"
package = "org.mrml.library.ssh"
scope = "compile"

[[dependency]]
alias = "mrml_terminal_style"
compile_name = "mrml-terminal-style"
package = "org.mrml.library.terminal-style"
scope = "compile"

[[binary]]
crate_name = "mrml_git_cli"
output = "mrml-git"
self_extern = true
source = "packages/tools/git/src/main.rs"

[[compile_env]]
name = "CARGO_PKG_VERSION"
value = "0.0.1"

