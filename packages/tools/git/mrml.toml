[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.tool.git"
kind = "tool"
name = "mrml-git"
profile = "host-tool"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "lib"
name = "mrml_git"

[[artifact]]
kind = "bin"
name = "mrml-git"

[[artifact]]
kind = "bin"
name = "mrml-git-protected-signer"

[[artifact]]
kind = "bin"
name = "mrml-git-credential-agent"

[[artifact]]
kind = "bin"
name = "mrml-git-release"

[rust]
crate_name = "mrml_git"
crate_type = "lib"
source = "packages/tools/git/src/lib.rs"

[[dependency]]
alias = "mrml_error"
compile_name = "mrml-error"
package = "org.mrml.library.error"
scope = "compile"

[[dependency]]
alias = "mrml_crypto"
compile_name = "mrml-crypto"
package = "org.mrml.library.crypto"
scope = "compile"

[[dependency]]
alias = "mrml_interface_detached_signing_v1"
compile_name = "mrml-interface-security-detached-signing-v1"
package = "org.mrml.interface.security.detached-signing"
scope = "compile"

[[dependency]]
alias = "mrml_http"
compile_name = "mrml-http"
package = "org.mrml.library.http"
scope = "compile"

[[dependency]]
alias = "mrml_openpgp"
compile_name = "mrml-openpgp"
package = "org.mrml.library.openpgp"
scope = "compile"

[[dependency]]
alias = "mrml_runtime"
compile_name = "mrml-runtime"
package = "org.mrml.library.runtime"
scope = "compile"

[[dependency]]
alias = "mrml_ssh"
compile_name = "mrml-ssh"
package = "org.mrml.library.ssh"
scope = "compile"

[[dependency]]
alias = "mrml_terminal_style"
compile_name = "mrml-terminal-style"
package = "org.mrml.library.terminal-style"
scope = "compile"

[[binary]]
crate_name = "mrml_git_cli"
output = "mrml-git"
self_extern = true
source = "packages/tools/git/src/main.rs"

[[binary]]
crate_name = "mrml_git_protected_signer"
output = "mrml-git-protected-signer"
self_extern = true
source = "packages/tools/git/src/protected_signer_main.rs"
targets = ["LINUX"]

[[binary]]
crate_name = "mrml_git_credential_agent"
output = "mrml-git-credential-agent"
self_extern = true
source = "packages/tools/git/src/credential_agent_main.rs"
targets = ["LINUX"]

[[binary]]
crate_name = "mrml_git_release"
output = "mrml-git-release"
self_extern = true
source = "packages/tools/git/src/release_main.rs"
targets = ["LINUX"]

[[compile_env]]
name = "CARGO_PKG_VERSION"
value = "0.0.1"

