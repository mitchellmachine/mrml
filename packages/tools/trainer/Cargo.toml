[package]
name = "mrml-trainer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Dependency-free MRML trainer and GGUF exporter"
autobins = false

[[bin]]
name = "mrml-trainer"
path = "src/main.rs"

[dependencies]
mrml-runtime = { path = "../../libraries/runtime" }
mrml-tokenizer = { path = "../../libraries/tokenizer" }
mrml-wikipedia = { path = "../../libraries/wikipedia" }
mrml-tensor = { path = "../../gpu/tensor" }
mrml-math = { path = "../../libraries/math" }
