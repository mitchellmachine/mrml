[package]
name = "mrml-whp-run"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Verified standalone MRML GPU benchmark launcher for WHP"

[features]
default = ["cuda"]
cuda = ["dep:mrml-tensor"]

[[bin]]
name = "mrml-whp-run"
path = "src/main.rs"

[dependencies]
mrml-crypto = { path = "../../../libraries/crypto", default-features = false }
mrml-error = { path = "../../../libraries/error" }
mrml-kernel = { path = "../../../system/kernel" }
mrml-runtime = { path = "../../../libraries/runtime" }
mrml-whp = { path = "../../../system/vmm/whp" }

[target.'cfg(target_os = "windows")'.dependencies]
mrml-tensor = { path = "../../../gpu/tensor", features = ["cuda"], optional = true }
