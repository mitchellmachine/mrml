[manifest]
format = "mrml"
version = 2

[package]
default = false
id = "org.mrml.tool.vmm-whp-run"
kind = "tool"
name = "mrml-whp-run"
profile = "host-tool"

[[target]]
arch = "x86_64"
environment = "windows"

[[feature]]
name = "cuda"

[[feature]]
name = "default"

[[artifact]]
kind = "bin"
name = "mrml-whp-run"

[rust]
crate_name = "mrml_whp_run_action"
crate_type = "none"
source = "-"

[[dependency]]
alias = "mrml_config"
compile_name = "mrml-config"
package = "org.mrml.service.config"
scope = "compile"
targets = ["WINDOWS"]

[[dependency]]
alias = "mrml_crypto"
compile_name = "mrml-crypto"
package = "org.mrml.library.crypto"
provider_profile = "core"
scope = "compile"
targets = ["WINDOWS"]

[[dependency]]
alias = "mrml_deployment"
compile_name = "mrml-deployment"
package = "org.mrml.service.deployment"
scope = "compile"
targets = ["WINDOWS"]

[[dependency]]
alias = "mrml_error"
compile_name = "mrml-error"
package = "org.mrml.library.error"
scope = "compile"
targets = ["WINDOWS"]

[[dependency]]
alias = "mrml_kernel"
compile_name = "mrml-kernel"
package = "org.mrml.system.kernel"
scope = "compile"
targets = ["WINDOWS"]

[[dependency]]
alias = "mrml_package_format"
compile_name = "mrml-package-format"
package = "org.mrml.library.package-format"
scope = "compile"
targets = ["WINDOWS"]

[[dependency]]
alias = "mrml_runtime"
compile_name = "mrml-runtime"
package = "org.mrml.library.runtime"
scope = "compile"
targets = ["WINDOWS"]

[[dependency]]
alias = "mrml_tensor"
compile_name = "mrml-tensor"
feature = "cuda"
package = "org.mrml.library.tensor"
scope = "compile"
targets = ["WINDOWS"]

[[dependency]]
alias = "mrml_whp"
compile_name = "mrml-whp"
package = "org.mrml.system.vmm-whp"
scope = "compile"
targets = ["WINDOWS"]

[[feature_set]]
features = []
targets = ["WINDOWS"]

[[feature_profile]]
features = ["cuda"]
name = "cuda"
targets = ["WINDOWS"]

[[extern_profile]]
compile_name = "mrml-tensor"
consumer = "cuda"
provider = "cuda"

[[binary]]
crate_name = "mrml_whp_run"
output = "mrml-whp-run"
self_extern = false
source = "packages/tools/vmm/whp-run/src/main.rs"
