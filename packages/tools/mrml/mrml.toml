[manifest]
format = "mrml"
version = 2

[package]
default = true
id = "org.mrml.tool.build"
kind = "bootstrap-tool"
name = "mrml"
profile = "host-tool"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "bin"
name = "mrml"

[rust]
crate_name = "mrml_build_action"
crate_type = "none"
source = "-"

[[binary]]
crate_name = "mrml"
output = "mrml"
self_extern = false
source = "packages/tools/mrml/src/main.rs"

