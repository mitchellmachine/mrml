[manifest]
format = "mrml"
version = 2

[package]
default = true
id = "org.mrml.tool.build"
kind = "bootstrap-tool"
name = "mrml"
profile = "host-tool"

[[target]]
arch = "x86_64"
environment = "windows"

[[target]]
arch = "x86_64"
environment = "linux"

[[artifact]]
kind = "bin"
name = "mrml"

[[artifact]]
kind = "bin"
name = "mrml-usb-writer"

[rust]
crate_name = "mrml_build_action"
crate_type = "none"
source = "-"

[[dependency]]
alias = "mrml_certificate"
compile_name = "mrml-certd"
package = "org.mrml.service.certificate"
scope = "compile"
targets = ["WINDOWS", "LINUX"]

[[binary]]
crate_name = "mrml"
output = "mrml"
self_extern = false
source = "packages/tools/mrml/src/main.rs"

[[binary]]
crate_name = "mrml_usb_writer"
output = "mrml-usb-writer"
self_extern = false
source = "packages/tools/mrml/src/usb_writer.rs"
targets = ["LINUX"]

