[workspace]
resolver = "2"
members = [
    "tools/mrml",
    "compiler/core",
    "crates/mrml-rustc-driver",
    "crates/mrml-kernel-image",
    "crates/mrml-service-image",
    "crates/mrml-config",
    "crates/mrml-storage",
    "crates/mrml-uefi",
    "crates/mrml-kernel",
    "crates/mrml-kernel-bench",
    "crates/mrml-sign",
    "packages/libraries/crypto",
    "packages/libraries/tls",
    "packages/libraries/http",
    "packages/libraries/runtime",
    "crates/mrml-model",
    "packages/libraries/math",
    "crates/mrml-tensor",
    "crates/mrml-agent",
    "crates/mrml-cli",
    "crates/mrml-git",
    "packages/libraries/ssh",
    "crates/mrml-machine",
    "packages/libraries/error",
    "crates/mrml-server",
    "packages/libraries/terminal-style",
    "crates/mrml-tools",
    "packages/libraries/percent-encoding",
    "packages/libraries/windows",
    "packages/libraries/linux",
    "crates/mrml-kvm",
    "crates/mrml-kvm-run",
    "crates/mrml-whp",
    "crates/mrml-whp-run",
    "packages/libraries/json",
    "packages/libraries/zim",
    "packages/libraries/zstd",
    "packages/libraries/wikipedia",
    "packages/libraries/tokenizer",
    "crates/mrml-trainer",
    "packages/libraries/av1",
    "packages/libraries/opus",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Mitchell Renouf <238751894+mitchellrenouf@users.noreply.github.com>"]
license = "CC0-1.0"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
panic = "abort"
