[workspace]
resolver = "2"
members = [
    "tools/mrml",
    "compiler/core",
    "compiler/driver",
    "system/bootloader",
    "system/service-image",
    "services/config",
    "services/storage",
    "packages/libraries/uefi",
    "system/kernel",
    "tests/kernel-bench",
    "tools/sign",
    "packages/libraries/crypto",
    "packages/libraries/tls",
    "packages/libraries/http",
    "packages/libraries/runtime",
    "crates/mrml-model",
    "packages/libraries/math",
    "packages/gpu/tensor",
    "crates/mrml-agent",
    "crates/mrml-cli",
    "tools/git",
    "packages/libraries/ssh",
    "crates/mrml-machine",
    "packages/libraries/error",
    "crates/mrml-server",
    "packages/libraries/terminal-style",
    "tools/host",
    "packages/libraries/percent-encoding",
    "packages/libraries/windows",
    "packages/libraries/linux",
    "system/vmm/kvm",
    "tools/vmm/kvm-run",
    "system/vmm/whp",
    "tools/vmm/whp-run",
    "packages/libraries/json",
    "packages/libraries/zim",
    "packages/libraries/zstd",
    "packages/libraries/wikipedia",
    "packages/libraries/tokenizer",
    "crates/mrml-trainer",
    "packages/libraries/av1",
    "packages/libraries/opus",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Mitchell Renouf <238751894+mitchellrenouf@users.noreply.github.com>"]
license = "CC0-1.0"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
panic = "abort"
