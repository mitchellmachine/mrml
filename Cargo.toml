[package]
name = "mrml"
version = "0.0.1"
edition = "2024"
authors = ["Mitchell Renouf <238751894+mitchellrenouf@users.noreply.github.com>"]
license = "CC0-1.0"
description = "Stage-zero bootstrap for the MRML-native build frontend"

[[bin]]
name = "mrml"
path = "packages/tools/mrml/src/main.rs"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
panic = "abort"
